<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и регистрация — Scrumbler</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <a href="/" class="nav-brand">
            {% include "components/rubik_cube.html" %}
            <span class="brand-name">Scrum<span>bler</span></span>
        </a>
        <a href="/" class="nav-item" style="color: var(--text-muted);">Продолжить как гость →</a>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <h1 id="auth-title" class="auth-title">Вход в аккаунт</h1>

            <div id="auth-error" class="alert-error"></div>

            <form id="auth-form">
                <div class="form-group">
                    <label for="username">Имя пользователя (Логин)</label>
                    <input type="text" id="username" class="form-input" placeholder="speedcuber33" required minlength="3" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" class="form-input" placeholder="Минимум 8 символов (A-Z, 0-9, !@#)" required minlength="8" autocomplete="current-password">
                </div>

                <button type="submit" id="btn-submit" class="btn-primary">Войти</button>
            </form>

            <div class="auth-switch">
                <span id="switch-text">Еще нет аккаунта?</span>
                <a href="#" id="switch-link">Зарегистрироваться</a>
            </div>

            <div style="text-align: center; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-color);">
                <a href="/" style="color: var(--text-muted); text-decoration: none; font-size: 0.85rem;">⚡ Войти как гость (просто таймер без сохранения)</a>
            </div>
        </div>
    </main>

    <script>
        let isLoginMode = true;

        const authTitle = document.getElementById('auth-title');
        const authForm = document.getElementById('auth-form');
        const btnSubmit = document.getElementById('btn-submit');
        const switchText = document.getElementById('switch-text');
        const switchLink = document.getElementById('switch-link');
        const authError = document.getElementById('auth-error');

        switchLink.addEventListener('click', (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            authError.style.display = 'none';

            if (isLoginMode) {
                authTitle.textContent = "Вход в аккаунт";
                btnSubmit.textContent = "Войти";
                switchText.textContent = "Еще нет аккаунта?";
                switchLink.textContent = "Зарегистрироваться";
            } else {
                authTitle.textContent = "Регистрация";
                btnSubmit.textContent = "Создать аккаунт";
                switchText.textContent = "Уже есть аккаунт?";
                switchLink.textContent = "Войти";
            }
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authError.style.display = 'none';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    if (Array.isArray(data.detail)) {
                        // Pydantic validation errors array
                        const messages = data.detail.map(err => {
                            let msg = err.msg || "Ошибка валидации";
                            if (msg.startsWith("Value error, ")) {
                                msg = msg.replace("Value error, ", "");
                            }
                            return msg;
                        });
                        authError.textContent = messages.join(". ");
                    } else if (typeof data.detail === 'string') {
                        authError.textContent = data.detail;
                    } else {
                        authError.textContent = "Произошла ошибка при выполнении запроса";
                    }
                    authError.style.display = 'block';
                    return;
                }

                // Auth success: redirect to main timer
                window.location.href = '/';
            } catch (err) {
                authError.textContent = "Не удалось подключиться к серверу";
                authError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
